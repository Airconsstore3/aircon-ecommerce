name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # NOTE: currently fails — 15 react-hooks/set-state-in-effect errors.
      # Fix or intentionally suppress them before relying on this gate.
      - name: Lint
        run: pnpm lint

      # NOTE: currently fails — next@16.3.6 has 5 high advisories.
      # Clears after upgrade to next >= 16.3.8.
      - name: Audit (prod deps, high+)
        run: pnpm audit --prod --audit-level=high

      - name: Test
        run: pnpm test

      # Placeholder env values — build-time only, no network calls made.
      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-key

  e2e:
    runs-on: ubuntu-latest
    # Playwright E2E requires a live Supabase project for SSR pages to render.
    # Required repo variables/secrets:
    #   vars.NEXT_PUBLIC_SUPABASE_URL               — project URL
    #   secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY — publishable (anon) key
    # Optional, only for authenticated account-page tests:
    #   secrets.E2E_USER_EMAIL, secrets.E2E_USER_PASSWORD
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      CI: true

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Build
        run: pnpm build

      - name: Run Playwright
        run: pnpm test:e2e:all

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
